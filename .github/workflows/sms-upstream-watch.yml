name: SMS upstream watch

# Once a week, checks whether NetBird has published a newer stable release than the one this
# fork's latest release is built on, and opens an issue when it has. Nothing is changed.
# Scheduled workflows only run from the default branch, so set the fork's default branch to
# multi-instance (Settings > Branches). Issues must be switched on (Settings > Features).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Compare the releases
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag=$(gh api repos/netbirdio/netbird/releases/latest --jq .tag_name)
          upstream=${upstream_tag#v}

          if ! ours_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null); then
            echo "The fork has no release yet, nothing to compare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ours=${ours_tag#v}
          ours=${ours%%-*}
          ours=${ours%%+*}

          echo "NetBird latest: $upstream. Fork latest release is built on: $ours." | tee -a "$GITHUB_STEP_SUMMARY"

          newest=$(printf '%s\n%s\n' "$upstream" "$ours" | sort -V | tail -n 1)
          if [ "$upstream" = "$ours" ] || [ "$newest" != "$upstream" ]; then
            echo "The fork is up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="NetBird v$upstream is out (the fork is on $ours)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An issue for v$upstream exists already." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body=$(cat <<EOF
          NetBird published v$upstream. The latest release of this fork is built on $ours.

          To move the fork up:
          1. Fetch the new release and rebase the \`multi-instance\` branch onto it (one commit per patch).
          2. Run \`sms/test-windows.ps1\` and \`sms/build-windows.ps1\`, and try the build on a test machine.
          3. Push, then run the "SMS release" workflow with version $upstream.

          Release notes: https://github.com/netbirdio/netbird/releases/tag/v$upstream
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          echo "Opened an issue for v$upstream." | tee -a "$GITHUB_STEP_SUMMARY"
